name: Daily Live Open-Data Showcase

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate live open-data samples and GitHub Pages showcase
        run: node scripts/generate_live_samples.mjs

      - name: Commit and push updated snapshot if changed
        run: |
          if git diff --quiet -- samples/LATEST_SNAPSHOT.md docs/index.html; then
            echo "No changes to snapshot or showcase."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/LATEST_SNAPSHOT.md docs/index.html
          git commit -m "chore(showcase): refresh daily live open-data snapshot"
          git push
