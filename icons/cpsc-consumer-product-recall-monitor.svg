<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="#0B162C"/>
  <circle cx="256" cy="240" r="220" fill="#13264A" fill-opacity="0.72"/>
  <circle cx="256" cy="236" r="155" fill="#EF4444" fill-opacity="0.14"/>

  <!-- Radar & safety scan rings -->
  <g stroke="#F59E0B" stroke-opacity="0.24" stroke-width="2.5" fill="none">
    <circle cx="256" cy="242" r="196"/>
    <circle cx="256" cy="242" r="144" stroke-dasharray="10 10"/>
    <line x1="256" y1="62" x2="256" y2="422"/>
    <line x1="76" y1="242" x2="436" y2="242"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="#F59E0B" stroke-opacity="0.72" stroke-width="4"/>

  <!-- Consumer Product Safety Shield Emblem -->
  <path d="M 140 118 L 256 78 L 372 118 L 372 246 C 372 326 320 388 256 416 C 192 388 140 326 140 246 Z"
        fill="#10203E" stroke="#FBBF24" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 158 130 L 256 96 L 354 130 L 354 244 C 354 313 309 367 256 393 C 203 367 158 313 158 244 Z"
        fill="#162B52" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- UPC / Barcode strip across lower shield -->
  <g fill="#CBD5E1">
    <rect x="192" y="304" width="8" height="36" rx="2"/>
    <rect x="206" y="304" width="4" height="36" rx="1"/>
    <rect x="216" y="304" width="12" height="36" rx="2"/>
    <rect x="234" y="304" width="5" height="36" rx="1"/>
    <rect x="245" y="304" width="10" height="36" rx="2"/>
    <rect x="261" y="304" width="4" height="36" rx="1"/>
    <rect x="271" y="304" width="12" height="36" rx="2"/>
    <rect x="289" y="304" width="6" height="36" rx="1"/>
    <rect x="301" y="304" width="10" height="36" rx="2"/>
    <rect x="316" y="304" width="4" height="36" rx="1"/>
  </g>

  <!-- High-visibility Recall Warning Triangle -->
  <path d="M 256 124 L 336 270 C 340 278 334 288 325 288 L 187 288 C 178 288 172 278 176 270 Z"
        fill="#DC2626" stroke="#FEF2F2" stroke-width="6" stroke-linejoin="round"/>
  <rect x="248" y="174" width="16" height="62" rx="8" fill="#FEF2F2"/>
  <circle cx="256" cy="258" r="10" fill="#FEF2F2"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#0B162C" fill-opacity="0.94" stroke="#F59E0B" stroke-opacity="0.86" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
