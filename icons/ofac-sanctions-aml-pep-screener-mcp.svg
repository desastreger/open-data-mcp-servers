<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C17"/>
      <stop offset="55%" stop-color="#0F1B30"/>
      <stop offset="100%" stop-color="#19162D"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070C17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle sanctions radar rings -->
  <g stroke="#38BDF8" stroke-opacity="0.16" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <circle cx="256" cy="244" r="144" stroke-dasharray="10 10"/>
    <circle cx="256" cy="244" r="92"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central AML / Sanctions Shield -->
  <path d="M 256 80 L 392 132 L 392 242 C 392 332 334 398 256 430 C 178 398 120 332 120 242 L 120 132 Z"
        fill="#0F172A" stroke="url(#shieldStroke)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner shield hairline -->
  <path d="M 256 112 L 362 152 L 362 240 C 362 314 316 368 256 396 C 196 368 150 314 150 240 L 150 152 Z"
        fill="none" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Radar sweep wedge inside shield -->
  <path d="M 256 244 L 336 184 A 100 100 0 0 1 350 244 Z" fill="url(#scanSweep)"/>

  <!-- Screening reticle crosshairs -->
  <g stroke="#38BDF8" stroke-opacity="0.48" stroke-width="3" stroke-linecap="round">
    <line x1="176" y1="244" x2="206" y2="244"/>
    <line x1="306" y1="244" x2="336" y2="244"/>
    <line x1="256" y1="164" x2="256" y2="194"/>
    <line x1="256" y1="294" x2="256" y2="324"/>
  </g>

  <!-- Central Crypto / Entity Ledger Diamond -->
  <polygon points="256,196 298,244 256,292 214,244"
           fill="#1E293B" stroke="#FBBF24" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="256,218 278,244 256,270 234,244"
           fill="#10B981" fill-opacity="0.85"/>

  <!-- Sanctioned Hit Alert Ping -->
  <circle cx="322" cy="184" r="12" fill="#EF4444" stroke="#FEF2F2" stroke-width="4"/>

  <!-- Clear Verified Node -->
  <circle cx="192" cy="304" r="9" fill="#10B981" stroke="#ECFDF5" stroke-width="3"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#070C17" fill-opacity="0.90" stroke="#F59E0B" stroke-opacity="0.76" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#FDE68A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
