<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C14"/>
      <stop offset="55%" stop-color="#171828"/>
      <stop offset="100%" stop-color="#251A3E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0C14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / ring depth -->
  <g stroke="#A78BFA" stroke-opacity="0.14" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <circle cx="256" cy="244" r="144" stroke-dasharray="12 10"/>
    <circle cx="256" cy="244" r="92"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Iconography -->
  <!-- Envelope Body -->
  <rect x="86" y="168" width="280" height="204" rx="28" fill="#1E2036" stroke="#E2E8F0" stroke-width="14"/>
  <!-- Envelope Flap -->
  <path d="M 94 180 L 226 276 L 358 180" fill="none" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower envelope fold accents -->
  <path d="M 98 358 L 178 286 M 354 358 L 274 286" fill="none" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>

  <!-- TLS Padlock / DNS Shield Seal overlapping top-right -->
  <path d="M 358 94 L 430 120 L 430 190 C 430 242 398 282 358 302 C 318 282 286 242 286 190 L 286 120 Z"
        fill="#121326" stroke="url(#violetCyan)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Padlock shackle inside shield -->
  <path d="M 336 178 L 336 158 C 336 144 380 144 380 158 L 380 178"
        fill="none" stroke="#22D3EE" stroke-width="11" stroke-linecap="round"/>
  <!-- Padlock body -->
  <rect x="324" y="178" width="68" height="54" rx="12" fill="url(#violetCyan)"/>
  <circle cx="358" cy="205" r="9" fill="#0B0C14"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#0B0C14" fill-opacity="0.86" stroke="#A78BFA" stroke-opacity="0.70" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#DDD6FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#DDD6FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#DDD6FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
