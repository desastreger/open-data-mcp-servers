<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061226"/>
      <stop offset="55%" stop-color="#0C2245"/>
      <stop offset="100%" stop-color="#073142"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="56%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#061226" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle radar rings & grid -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="248" r="196"/>
    <circle cx="256" cy="248" r="142" stroke-dasharray="10 10"/>
    <line x1="64" y1="136" x2="448" y2="136"/>
    <line x1="64" y1="248" x2="448" y2="248"/>
    <line x1="64" y1="360" x2="448" y2="360"/>
    <line x1="142" y1="64" x2="142" y2="424"/>
    <line x1="256" y1="64" x2="256" y2="424"/>
    <line x1="370" y1="64" x2="370" y2="424"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- SEC Form 13F-HR Filing Card -->
  <path d="M 104 90 L 244 90 L 302 148 L 302 372 C 302 386 291 397 277 397 L 104 397 C 90 397 79 386 79 372 L 79 115 C 79 101 90 90 104 90 Z"
        fill="url(#docGrad)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 244 90 L 244 134 C 244 142 250 148 258 148 L 302 148 Z" fill="#94A3B8"/>

  <!-- Filing summary lines -->
  <rect x="112" y="140" width="96" height="20" rx="10" fill="#0C2245"/>
  <rect x="112" y="180" width="144" height="14" rx="7" fill="#64748B" fill-opacity="0.58"/>
  <rect x="112" y="210" width="118" height="14" rx="7" fill="#64748B" fill-opacity="0.45"/>

  <!-- Pure-vector "13F" Badge Stamp -->
  <rect x="110" y="262" width="128" height="84" rx="18" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="8"/>
  <!-- "1" -->
  <path d="M 134 292 L 143 284 L 143 324 M 134 324 L 152 324"
        fill="none" stroke="#0369A1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "3" -->
  <path d="M 164 287 C 176 283 185 289 183 298 C 182 303 175 304 171 304 C 178 304 185 308 184 316 C 183 324 172 327 163 322"
        fill="none" stroke="#0369A1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "F" -->
  <path d="M 200 324 L 200 285 L 222 285 M 200 304 L 217 304"
        fill="none" stroke="#0369A1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Institutional Whale Medallion (Right / Foreground) -->
  <circle cx="348" cy="250" r="106" fill="#07172D" fill-opacity="0.95" stroke="url(#whaleGrad)" stroke-width="12"/>

  <!-- Portfolio allocation bars behind whale fluke -->
  <g opacity="0.35">
    <rect x="284" y="274" width="22" height="44" rx="6" fill="#38BDF8"/>
    <rect x="318" y="250" width="22" height="68" rx="6" fill="#34D399"/>
    <rect x="352" y="228" width="22" height="90" rx="6" fill="#38BDF8"/>
    <rect x="386" y="206" width="22" height="112" rx="6" fill="#34D399"/>
  </g>

  <!-- Stylized Whale Tail Fluke (Whale Investor Symbol) -->
  <path d="M 348 312
           C 344 274 334 252 314 236
           C 295 222 276 226 276 212
           C 276 196 306 194 328 214
           C 338 224 344 236 348 248
           C 352 236 358 224 368 214
           C 390 194 420 196 420 212
           C 420 226 401 222 382 236
           C 362 252 352 274 348 312 Z"
        fill="url(#whaleGrad)" stroke="#E0F2FE" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ocean wave arc under whale fluke -->
  <path d="M 282 316 Q 315 304 348 316 Q 381 328 414 316"
        fill="none" stroke="#6EE7B7" stroke-width="6" stroke-linecap="round"/>

  <!-- Top-right Whale Dollar Crown / Coin Badge -->
  <circle cx="398" cy="124" r="42" fill="url(#goldGrad)" stroke="#07172D" stroke-width="10"/>
  <path d="M 398 102 L 398 146 M 410 111 C 402 106 388 107 387 116 C 387 125 410 123 410 132 C 410 140 396 142 386 137"
        fill="none" stroke="#451A03" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#051120" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.78" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
