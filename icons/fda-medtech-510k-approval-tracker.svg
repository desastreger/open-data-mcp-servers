<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031525"/>
      <stop offset="55%" stop-color="#07314A"/>
      <stop offset="100%" stop-color="#0B4F6C"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#031525" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cyanEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / radar rings -->
  <g stroke="#67E8F9" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="242" r="196"/>
    <circle cx="256" cy="242" r="146" stroke-dasharray="10 10"/>
    <line x1="256" y1="62" x2="256" y2="422"/>
    <line x1="76" y1="242" x2="436" y2="242"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Regulatory Clearance Shield -->
  <path d="M 256 76 L 386 122 L 386 244 C 386 330 330 392 256 422 C 182 392 126 330 126 244 L 126 122 Z"
        fill="#041F32" stroke="url(#cyanEmeraldGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner shield subtle outline -->
  <path d="M 256 98 L 364 136 L 364 242 C 364 316 316 368 256 396 C 196 368 148 316 148 242 L 148 136 Z"
        fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Medical Device Cross + Sensor Nodes -->
  <path d="M 232 140 L 280 140 L 280 188 L 328 188 L 328 236 L 280 236 L 280 284 L 232 284 L 232 236 L 184 236 L 184 188 L 232 188 Z"
        fill="#E0F2FE" fill-opacity="0.95"/>

  <!-- Telemetry Pulse Line across Medical Cross -->
  <path d="M 164 212 L 208 212 L 226 178 L 248 248 L 270 192 L 286 212 L 348 212"
        fill="none" stroke="#0284C7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FDA Clearance Approval Seal + Checkmark Badge (Bottom-Left/Center overlap) -->
  <circle cx="332" cy="316" r="56" fill="#031525" stroke="url(#checkGrad)" stroke-width="10"/>
  <path d="M 304 316 L 324 336 L 362 296"
        fill="none" stroke="url(#checkGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 510(k) Vector Micro-Bars on Left of Shield -->
  <g stroke="#67E8F9" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="176" y1="312" x2="246" y2="312"/>
    <line x1="176" y1="336" x2="226" y2="336"/>
  </g>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#031525" fill-opacity="0.88" stroke="#22D3EE" stroke-opacity="0.72" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#A5F3FC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#A5F3FC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#A5F3FC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
