<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131D"/>
      <stop offset="55%" stop-color="#1C2232"/>
      <stop offset="100%" stop-color="#33161E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="54%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0E131D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / ring depth -->
  <g stroke="#F87171" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <circle cx="256" cy="244" r="144" stroke-dasharray="10 10"/>
    <line x1="68" y1="244" x2="444" y2="244"/>
    <line x1="256" y1="64" x2="256" y2="424"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Iconography -->
  <!-- Bold House Silhouette -->
  <path d="M 88 232 L 222 114 L 356 232"
        fill="none" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 122 214 L 122 372 C 122 384 132 394 144 394 L 300 394 C 312 394 322 384 322 372 L 322 214 L 222 126 Z"
        fill="#1E293B" stroke="#E2E8F0" stroke-width="14" stroke-linejoin="round"/>
  <!-- Door & window cutouts -->
  <rect x="194" y="294" width="56" height="100" rx="8" fill="#0E131D"/>
  <rect x="184" y="206" width="76" height="54" rx="10" fill="#0E131D" stroke="#94A3B8" stroke-width="6"/>

  <!-- Warning Alert Beacon Triangle (Crimson-Amber) -->
  <path d="M 358 178 L 444 336 C 450 348 441 362 428 362 L 288 362 C 275 362 266 348 272 336 Z"
        fill="url(#alertGrad)" stroke="#0E131D" stroke-width="12" stroke-linejoin="round"/>
  <!-- Crisp exclamation mark -->
  <line x1="358" y1="232" x2="358" y2="294" stroke="#1E0B0E" stroke-width="18" stroke-linecap="round"/>
  <circle cx="358" cy="328" r="11" fill="#1E0B0E"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#0D111A" fill-opacity="0.86" stroke="#F87171" stroke-opacity="0.70" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#FECACA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#FECACA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#FECACA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
