<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04152E"/>
      <stop offset="55%" stop-color="#082D56"/>
      <stop offset="100%" stop-color="#074156"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04152E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="60%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / ring depth -->
  <g stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <ellipse cx="256" cy="244" rx="196" ry="76"/>
    <ellipse cx="256" cy="244" rx="76" ry="196"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Iconography -->
  <!-- Bold Globe Wireframe -->
  <circle cx="256" cy="242" r="144" fill="#072242" fill-opacity="0.75" stroke="url(#tealGrad)" stroke-width="14"/>
  <ellipse cx="256" cy="242" rx="68" ry="144" fill="none" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="8"/>
  <line x1="112" y1="242" x2="400" y2="242" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="8"/>
  <path d="M 136 176 Q 256 202 376 176" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="8"/>

  <!-- EU/US Star Arc Accent (top-left to top-right) -->
  <g fill="url(#goldAccent)">
    <polygon points="154,100 159,113 173,113 162,121 166,134 154,126 142,134 146,121 135,113 149,113"/>
    <polygon points="204,76 209,89 223,89 212,97 216,110 204,102 192,110 196,97 185,89 199,89"/>
    <polygon points="256,68 261,81 275,81 264,89 268,102 256,94 244,102 248,89 237,81 251,81"/>
    <polygon points="308,76 313,89 327,89 316,97 320,110 308,102 296,110 300,97 289,89 303,89"/>
    <polygon points="358,100 363,113 377,113 366,121 370,134 358,126 346,134 350,121 339,113 353,113"/>
  </g>

  <!-- Balanced Tariff Scale + Shipping Container Bars -->
  <line x1="256" y1="168" x2="256" y2="352" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
  <line x1="202" y1="354" x2="310" y2="354" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round"/>
  <!-- Cross-beam -->
  <line x1="138" y1="206" x2="374" y2="182" stroke="url(#goldAccent)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="194" r="14" fill="#FDE68A" stroke="#04152E" stroke-width="6"/>

  <!-- Left container pan -->
  <path d="M 142 206 L 112 276 L 172 276 Z" fill="none" stroke="#99F6E4" stroke-width="8" stroke-linejoin="round"/>
  <rect x="104" y="274" width="76" height="32" rx="8" fill="#14B8A6"/>

  <!-- Right container pan -->
  <path d="M 370 182 L 340 252 L 400 252 Z" fill="none" stroke="#FDE68A" stroke-width="8" stroke-linejoin="round"/>
  <rect x="332" y="250" width="76" height="32" rx="8" fill="#F59E0B"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#041226" fill-opacity="0.86" stroke="#2DD4BF" stroke-opacity="0.70" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#99F6E4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#99F6E4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#99F6E4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
