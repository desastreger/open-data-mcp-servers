<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="55%" stop-color="#0B2242"/>
      <stop offset="100%" stop-color="#06383B"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="52%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#059669" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#061224" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / ring depth -->
  <g stroke="#34D399" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <circle cx="256" cy="244" r="144" stroke-dasharray="10 10"/>
    <line x1="64" y1="132" x2="448" y2="132"/>
    <line x1="64" y1="244" x2="448" y2="244"/>
    <line x1="64" y1="356" x2="448" y2="356"/>
    <line x1="140" y1="64" x2="140" y2="424"/>
    <line x1="256" y1="64" x2="256" y2="424"/>
    <line x1="372" y1="64" x2="372" y2="424"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Iconography -->
  <!-- SEC Form D Document -->
  <path d="M 118 96 L 266 96 L 326 156 L 326 376 C 326 390 315 401 301 401 L 118 401 C 104 401 93 390 93 376 L 93 121 C 93 107 104 96 118 96 Z"
        fill="url(#docGrad)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M 266 96 L 266 142 C 266 150 272 156 280 156 L 326 156 Z" fill="#94A3B8"/>

  <!-- Document lines -->
  <rect x="128" y="140" width="110" height="22" rx="11" fill="#0B2242"/>
  <rect x="128" y="186" width="162" height="16" rx="8" fill="#64748B" fill-opacity="0.65"/>
  <rect x="128" y="220" width="136" height="16" rx="8" fill="#64748B" fill-opacity="0.50"/>
  <rect x="128" y="254" width="112" height="16" rx="8" fill="#64748B" fill-opacity="0.40"/>

  <!-- Form D badge stamp -->
  <rect x="128" y="302" width="84" height="58" rx="14" fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="10"/>
  <path d="M 152 318 L 152 344 M 152 318 L 166 318 C 177 318 182 323 182 331 C 182 339 177 344 166 344 L 152 344"
        fill="none" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward growth spark / funding ring -->
  <circle cx="348" cy="278" r="96" fill="#071529" fill-opacity="0.94" stroke="url(#emeraldGrad)" stroke-width="14"/>
  <path d="M 282 314 L 324 272 L 352 292 L 404 228"
        fill="none" stroke="url(#sparkGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 366 226 L 406 224 L 404 264"
        fill="none" stroke="url(#sparkGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dollar node badge -->
  <circle cx="388" cy="140" r="46" fill="url(#emeraldGrad)" stroke="#071529" stroke-width="10"/>
  <path d="M 388 114 L 388 166 M 401 124 C 397 120 380 119 377 129 C 374 139 402 140 400 151 C 398 161 380 160 375 155"
        fill="none" stroke="#042F1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#051120" fill-opacity="0.86" stroke="#34D399" stroke-opacity="0.70" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
