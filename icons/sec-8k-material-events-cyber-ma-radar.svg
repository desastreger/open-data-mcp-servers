<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091022"/>
      <stop offset="55%" stop-color="#141C3A"/>
      <stop offset="100%" stop-color="#1B1336"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="58%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#091022" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="55%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle radar rings & grid -->
  <g stroke="#38BDF8" stroke-opacity="0.13" stroke-width="2" fill="none">
    <circle cx="256" cy="248" r="196"/>
    <circle cx="256" cy="248" r="140" stroke-dasharray="10 10"/>
    <line x1="64" y1="136" x2="448" y2="136"/>
    <line x1="64" y1="248" x2="448" y2="248"/>
    <line x1="64" y1="360" x2="448" y2="360"/>
    <line x1="142" y1="64" x2="142" y2="424"/>
    <line x1="256" y1="64" x2="256" y2="424"/>
    <line x1="370" y1="64" x2="370" y2="424"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- SEC Form 8-K Filing Card -->
  <path d="M 104 90 L 248 90 L 306 148 L 306 374 C 306 388 295 399 281 399 L 104 399 C 90 399 79 388 79 374 L 79 115 C 79 101 90 90 104 90 Z"
        fill="url(#docGrad)" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 248 90 L 248 134 C 248 142 254 148 262 148 L 306 148 Z" fill="#94A3B8"/>

  <!-- Header bar & item rows inside filing -->
  <rect x="112" y="138" width="102" height="20" rx="10" fill="#0F172A"/>
  <rect x="112" y="178" width="150" height="14" rx="7" fill="#64748B" fill-opacity="0.58"/>
  <rect x="112" y="208" width="124" height="14" rx="7" fill="#64748B" fill-opacity="0.45"/>

  <!-- "8K" Vector Badge Stamp -->
  <rect x="112" y="258" width="126" height="86" rx="18" fill="#E11D48" fill-opacity="0.14" stroke="#E11D48" stroke-width="8"/>
  <!-- "8" -->
  <circle cx="150" cy="288" r="13" fill="none" stroke="#BE123C" stroke-width="9"/>
  <circle cx="150" cy="315" r="15" fill="none" stroke="#BE123C" stroke-width="9"/>
  <!-- "K" -->
  <path d="M 184 275 L 184 330 M 212 275 L 186 302 L 214 330"
        fill="none" stroke="#BE123C" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyber & Material Event Radar Hub (Right / Foreground) -->
  <circle cx="348" cy="252" r="102" fill="#0B132B" fill-opacity="0.95" stroke="#38BDF8" stroke-width="11"/>

  <!-- Cyber Shield inside hub -->
  <path d="M 348 184 L 402 206 L 402 254 C 402 290 378 316 348 328 C 318 316 294 290 294 254 L 294 206 Z"
        fill="url(#shieldGrad)" stroke="#FFE4E6" stroke-width="5" stroke-linejoin="round"/>

  <!-- Alert lightning / pulse inside shield -->
  <path d="M 356 218 L 332 256 L 352 256 L 340 294 L 368 248 L 348 248 Z"
        fill="url(#amberGrad)"/>

  <!-- Top-right Materiality Alert Badge -->
  <circle cx="404" cy="126" r="42" fill="url(#amberGrad)" stroke="#091022" stroke-width="9"/>
  <path d="M 404 106 L 404 128" fill="none" stroke="#091022" stroke-width="9" stroke-linecap="round"/>
  <circle cx="404" cy="144" r="5" fill="#091022"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#051120" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.78" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
