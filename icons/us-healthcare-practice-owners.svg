<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041C1F"/>
      <stop offset="55%" stop-color="#08343A"/>
      <stop offset="100%" stop-color="#0A4B47"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#041C1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app icon base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#glowGrad)"/>

  <!-- Subtle geometric grid / ring depth -->
  <g stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="2" fill="none">
    <circle cx="256" cy="244" r="196"/>
    <circle cx="256" cy="244" r="146" stroke-dasharray="10 10"/>
    <line x1="256" y1="64" x2="256" y2="424"/>
    <line x1="76" y1="244" x2="436" y2="244"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Central Iconography -->
  <!-- Clinic Shield / Badge Base -->
  <rect x="116" y="106" width="280" height="276" rx="64" fill="#06282C" stroke="url(#mintGrad)" stroke-width="14"/>

  <!-- Bold Medical Cross -->
  <path d="M 226 154 L 286 154 L 286 214 L 346 214 L 346 274 L 286 274 L 286 334 L 226 334 L 226 274 L 166 274 L 166 214 L 226 214 Z"
        fill="#ECFDF5"/>

  <!-- Stethoscope Wrap + Chestpiece + Earpiece Head -->
  <path d="M 148 332 C 122 368 158 416 214 408 C 280 398 358 344 374 268 C 384 220 378 176 356 148"
        fill="none" stroke="url(#mintGrad)" stroke-width="15" stroke-linecap="round"/>
  <!-- Stethoscope earpieces arc top-right -->
  <path d="M 332 134 C 344 122 368 122 380 134"
        fill="none" stroke="#A7F3D0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="330" cy="136" r="10" fill="#ECFDF5"/>
  <circle cx="382" cy="136" r="10" fill="#ECFDF5"/>
  <!-- Stethoscope chestpiece -->
  <circle cx="144" cy="336" r="32" fill="#041C1F" stroke="#A7F3D0" stroke-width="12"/>
  <circle cx="144" cy="336" r="11" fill="#34D399"/>

  <!-- ECG Pulse line across medical cross -->
  <path d="M 184 244 L 218 244 L 234 214 L 256 274 L 274 228 L 290 244 L 328 244"
        fill="none" stroke="#059669" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#031618" fill-opacity="0.86" stroke="#34D399" stroke-opacity="0.70" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
