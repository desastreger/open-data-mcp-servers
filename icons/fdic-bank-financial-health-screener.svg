<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rounded-square dark treasury navy base -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="#081A33"/>
  <circle cx="256" cy="236" r="210" fill="#0B2240"/>
  <circle cx="256" cy="236" r="150" fill="#0E344A"/>

  <!-- Subtle treasury grid & radar rings -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2.5" fill="none">
    <circle cx="256" cy="240" r="196"/>
    <circle cx="256" cy="240" r="144" stroke-dasharray="10 10"/>
    <line x1="256" y1="58" x2="256" y2="420"/>
    <line x1="74" y1="240" x2="438" y2="240"/>
  </g>

  <!-- Inner bevel border -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="#34D399" stroke-opacity="0.75" stroke-width="4"/>

  <!-- Classical Bank Facade -->
  <path d="M 118 164 L 244 96 L 370 164 Z" fill="#0D2240" stroke="#F59E0B" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="244" cy="138" r="12" fill="#FBBF24"/>
  <rect x="112" y="166" width="264" height="16" rx="6" fill="#F59E0B"/>
  <rect x="116" y="168" width="256" height="5" rx="2.5" fill="#FDE68A" fill-opacity="0.65"/>

  <!-- Bank Pillars -->
  <g fill="#E2E8F0">
    <rect x="136" y="190" width="24" height="114" rx="5"/>
    <rect x="198" y="190" width="24" height="114" rx="5"/>
    <rect x="260" y="190" width="24" height="114" rx="5"/>
    <rect x="322" y="190" width="24" height="114" rx="5"/>
  </g>
  <g fill="#94A3B8" fill-opacity="0.45">
    <rect x="152" y="194" width="6" height="106" rx="2"/>
    <rect x="214" y="194" width="6" height="106" rx="2"/>
    <rect x="276" y="194" width="6" height="106" rx="2"/>
    <rect x="338" y="194" width="6" height="106" rx="2"/>
  </g>

  <!-- Base Steps -->
  <rect x="110" y="310" width="268" height="18" rx="6" fill="#38BDF8"/>
  <rect x="96" y="334" width="296" height="18" rx="6" fill="#1E3A5F" stroke="#38BDF8" stroke-width="3"/>

  <!-- Financial Health Pulse Shield Overlay -->
  <path d="M 332 256 L 400 280 L 400 334 C 400 374 370 400 332 414 C 294 400 264 374 264 334 L 264 280 Z"
        fill="#07192E" stroke="#10B981" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 332 268 L 388 288 L 388 334 C 388 366 362 388 332 400 C 302 388 276 366 276 334 L 276 288 Z"
        fill="none" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="2.5"/>
  <path d="M 284 334 L 306 334 L 320 306 L 336 358 L 350 322 L 362 334 L 380 334"
        fill="none" stroke="#6EE7B7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right MCP pill badge (pure vector paths) -->
  <g>
    <rect x="342" y="420" width="130" height="52" rx="26" fill="#061426" fill-opacity="0.95" stroke="#10B981" stroke-width="3"/>
    <path d="M 369 456 L 369 436 L 380 448 L 391 436 L 391 456" fill="none" stroke="#6EE7B7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 418 438 C 413 434 404 435 403 446 C 404 457 413 458 418 454" fill="none" stroke="#6EE7B7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 431 456 L 431 436 L 442 436 C 449 436 449 447 442 447 L 431 447" fill="none" stroke="#6EE7B7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
